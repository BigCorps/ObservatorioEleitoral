[project]
name = "observatorio-eleitoral"
version = "0.1.0"
description = "Auditoria reproduzível dos dados oficiais do TSE (eleições presidenciais 2022 e 2026)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "duckdb>=1.0",
  "polars>=1.0",
  "pyarrow>=15",
  "py7zr>=0.21",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "asn1tools>=0.166",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
observatorio = "observatorio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observatorio*"]
